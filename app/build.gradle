plugins {
    id 'com.android.application'
}

android {
    namespace 'com.droidspace16.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.droidspace16.app'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '1.1.0'

        // Support both modern 64-bit ARM and older 32-bit ARM Android phones.
        // The current launcher is Java-only and contains no ABI-specific native code.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
}
