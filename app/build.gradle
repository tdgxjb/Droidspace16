plugins {
    id 'com.android.application'
}

android {
    namespace 'com.droidspace16.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.droidspace16.app'
        minSdk 23
        targetSdk 28
        versionCode 3
        versionName '1.2.0'
    }

    // Produce separate ARMv7 and ARM64 APK variants, plus a universal APK.
    // The current Java launcher has no native .so libraries; this config alone
    // does not make the separately packaged QEMU engine support ARMv7.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }
}
